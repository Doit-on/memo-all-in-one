    <line x1="62" y1="58" x2="75" y2="65" stroke="#92FE9D" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="37" x2="62" y2="44" stroke="#92FE9D" stroke-width="3" stroke-linecap="round"/>
