  <text x="125" y="48" font-family="'Sarabun', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" letter-spacing="1">LOGMAT INTEGRATION</text>
  <text x="125" y="74" font-family="'Sarabun', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#0284c7">บริษัท ล๊อกแมท อินทิเกรชั่น จำกัด</text>
